# WireGuard 設備清單 — 給 wg-manage.sh 用（唯一真相）
#
# 一行一台，只寫名稱：
#   iphone
#   ipad
#
#   - 名稱: [a-z0-9_-]+，會對應 /etc/wireguard/<名稱>.key/.pub 與 clients/<名稱>.conf
#   - IP 由 wg-manage.sh 自動配發（.2 起跳，跳過 server），記錄在
#     /etc/wireguard/devices.map，同名重跑拿回同一個 IP
#   - 進階：也可寫 "<名稱> <隧道IP>" 手動釘選，自動配發會避開
#   - 一機一 key：同一個 conf 不要同時給兩台上線（會搶 endpoint、握手無限重試）
#
# 新增設備:加一行後跑  sudo ./wg-manage.sh
# 移除設備:刪掉那行後跑  sudo ./wg-manage.sh
#   → peer、clients/<名稱>.conf、key、IP 一併刪除（server 金鑰永遠不動）
iphone
ipad
