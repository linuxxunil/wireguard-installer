# WireGuard 統一設定檔 — 給 wg-install.sh / wg-manage.sh / wg-status.sh 共用
#
# 優先順序：內建預設 < 本檔 < 環境變數（臨時覆寫用 WG_PORT=... ./wg-manage.sh）
# 注意：必須用 ${VAR:-預設} 形式，環境變數已設定時不覆蓋。
# 路徑可用絕對路徑，或相對於本檔所在目錄的相對路徑（如 ./clients/）

# 監聽 UDP 埠
WG_PORT="${WG_PORT:-30443}"
# VPN 網段（server 與自動配發都以此為準）
WG_SUBNET="${WG_SUBNET:-10.20.20.0/24}"
# 伺服器隧道 IP
WG_SERVER_IP="${WG_SERVER_IP:-10.20.20.1}"
# 客戶端連線位址（公網域名或 IP）
WG_ENDPOINT="${WG_ENDPOINT:-example.com}"
# 客戶端 DNS
WG_DNS="${WG_DNS:-1.1.1.1}"
# 客戶端路由（全流量走 VPN；只走內網如 10.1.0.0/16）
WG_ALLOWED_IPS="${WG_ALLOWED_IPS:-0.0.0.0/0}"
# 對外網卡（空字串 = 自動偵測預設路由出口）
WG_OUT_IF="${WG_OUT_IF:-}"
# client .conf 輸出目錄（統一管理）
WG_OUT="${WG_OUT:-./clients/}"
# 設備清單檔
WG_DEVICES="${WG_DEVICES:-./devices.conf}"
# IP 配發記錄（主機狀態，不進版控）
WG_MAP="${WG_MAP:-/etc/wireguard/devices.map}"
